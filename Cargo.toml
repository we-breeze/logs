[package]
name = "brz-logs"
version = "0.0.5"
authors = ["we-breeze contributors"]
edition = "2024"
description = "Process-level tracing backend for Breeze services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/logs"

[dependencies]
brz-ds = { package = "brz-ds", version = "0.0.2" }
brz-metrics = { package = "brz-metrics", optional = true, version = "0.0.3" }
thiserror = "2"
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
metrics = ["dep:brz-metrics"]

[lib]
name = "brz_logs"
