[package]
name = "logs"
version = "0.1.0"
authors = ["icy"]
edition = "2024"
description = "Process-level tracing backend for Breeze services"

[dependencies]
brz-ds = { package = "ds", git = "https://github.com/we-breeze/ds.git", tag = "v0.0.1" }
brz-metrics = { package = "metrics", git = "https://github.com/we-breeze/metrics.git", tag = "v0.0.2", optional = true }
thiserror = "2"
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
metrics = ["dep:brz-metrics"]
